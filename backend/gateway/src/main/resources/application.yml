server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://127.0.0.1:5173"
              - "http://localhost:5173"
              - "http://127.0.0.1:4173"
              - "http://localhost:4173"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: knowledge-service
          uri: lb://knowledge-service
          predicates:
            - Path=/knowledge/**
        - id: community-service
          uri: lb://community-service
          predicates:
            - Path=/post/**,/comment/**,/square/**
        - id: message-service
          uri: lb://message-service
          predicates:
            - Path=/message/**,/notification/**,/feedback/**
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://127.0.0.1:8200}
          predicates:
            - Path=/ai/**

server:
  port: 8080
  address: ${GATEWAY_BIND_ADDRESS:127.0.0.1}
  max-http-request-header-size: 16KB

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        ip: ${SERVICE_REGISTER_IP:127.0.0.1}
    gateway:
      default-filters:
        - name: RequestSize
          args:
            maxSize: 220MB
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://127.0.0.1:5173"
              - "http://localhost:5173"
              - "http://127.0.0.1:4173"
              - "http://localhost:4173"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:lb://user-service}
          predicates:
            - Path=/user/**
        - id: knowledge-service
          uri: ${KNOWLEDGE_SERVICE_URL:lb://knowledge-service}
          predicates:
            - Path=/knowledge/**
        - id: community-service
          uri: ${COMMUNITY_SERVICE_URL:lb://community-service}
          predicates:
            - Path=/post/**,/comment/**,/square/**
        - id: message-service
          uri: ${MESSAGE_SERVICE_URL:lb://message-service}
          predicates:
            - Path=/message/**,/notification/**,/feedback/**,/event/**
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://127.0.0.1:8200}
          predicates:
            - Path=/ai/**

auth:
  revocation:
    # redis: end sessions that user-service revoked (logout, password change, suspension) before they expire.
    store: ${AUTH_REVOCATION_STORE:memory}

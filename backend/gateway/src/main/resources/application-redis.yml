spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cloud:
    gateway:
      default-filters:
        - name: RequestSize
          args:
            maxSize: 100MB
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@clientKeyResolver}"
            redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH:20}
            redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST:40}
            redis-rate-limiter.requestedTokens: 1

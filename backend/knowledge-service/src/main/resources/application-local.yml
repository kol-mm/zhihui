spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

knowledge:
  storage:
    mode: local
    local-root: ../data/uploads
    minio:
      endpoint: http://127.0.0.1:9000
      bucket: ai-knowledge
  search:
    mode: local
    elasticsearch:
      endpoint: http://127.0.0.1:9200
      index: ai-knowledge

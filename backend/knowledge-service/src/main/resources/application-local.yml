spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

knowledge:
  storage:
    mode: ${KNOWLEDGE_STORAGE_MODE:local}
    local-root: ../data/uploads
    minio:
      endpoint: http://127.0.0.1:9000
      bucket: ai-knowledge
      access-key: ${MINIO_ACCESS_KEY:aiknowledge}
      secret-key: ${MINIO_SECRET_KEY:ai-knowledge-local-change-me}
  search:
    mode: local
    elasticsearch:
      endpoint: http://127.0.0.1:9200
      index: ai-knowledge

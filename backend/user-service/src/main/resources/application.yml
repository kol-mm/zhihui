server:
  port: 8101
  address: ${SERVICE_BIND_ADDRESS:127.0.0.1}
  max-http-request-header-size: 16KB

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        ip: ${SERVICE_REGISTER_IP:127.0.0.1}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

auth:
  revocation:
    # redis: the gateway sees logouts and signed-out accounts; memory: single-process local runs only.
    store: ${AUTH_REVOCATION_STORE:memory}

app:
  # 邮箱验证码的发信服务器；不配置 SMTP_HOST 时用户仍可绑定邮箱，只是无法验证。
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:}
    # ssl（465 端口）、starttls（587 端口）或 none
    security: ${SMTP_SECURITY:ssl}

user:
  avatar:
    storage-mode: ${USER_AVATAR_STORAGE_MODE:${KNOWLEDGE_STORAGE_MODE:local}}
    local-root: ../data/user-avatars
    minio:
      endpoint: http://127.0.0.1:9000
      bucket: ai-user-avatar
      access-key: ${MINIO_ACCESS_KEY:aiknowledge}
      secret-key: ${MINIO_SECRET_KEY:ai-knowledge-local-change-me}

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/user_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Versioned schema changes live in src/main/resources/db/migration. A database that predates Flyway is
  # baselined at version 0, so V1 (written to be idempotent) still runs and brings it up to date.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: before Flyway

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

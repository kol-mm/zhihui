map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 220m;
    server_tokens off;

    # Assets are compressed at build time (vite.config.mjs); anything else is compressed on the fly.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # nginx drops every inherited add_header as soon as a location declares one of its own, so the headers are
    # repeated in each location rather than set once for the server. /api/ deliberately has none: the gateway
    # sends its own, and a second set here would reach the browser as a conflicting duplicate.

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        proxy_pass http://gateway:8080/;
        proxy_http_version 1.1;
        # 保留端口（如 :8088）：网关按 Host 判断请求是否同源，缺少端口会拒绝页面自己的 POST。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Build output carries a content hash in its name, so it can be cached for good.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;

        # The stock MIME map has no .mjs, and browsers refuse module scripts (the PDF worker) of any other type.
        location ~* \.mjs$ {
            types { }
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The page itself: everything it needs comes from this origin, so nothing outside it may load, frame it or
    # be framed by it. Element Plus and Vue write style attributes at runtime, and pdf.js reads previews from
    # blob: URLs it creates, which is why those two exceptions are here.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' blob:" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' blob:" always;
        try_files $uri $uri/ /index.html;
    }
}

# 4 GB single-server deployment. Replace the root path with the actual project path.
server {
    listen 80;
    server_name _;

    root /opt/ai-knowledge/frontend/dist;
    index index.html;
    # Deliberately small on this profile: a 4 GB server does not have the memory for large uploads.
    client_max_body_size 25m;
    server_tokens off;

    location ^~ /api/ {
        # No add_header here on purpose: the gateway sends its own security headers, and a second set would
        # reach the browser as a conflicting duplicate.
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # nginx drops every inherited add_header as soon as a location declares one of its own, so the page's
    # headers are set per location rather than once on the server. Everything the page needs comes from this
    # origin; the two exceptions are the style attributes Vue and Element Plus write at runtime and the blob:
    # URLs pdf.js reads previews from.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' blob:" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
